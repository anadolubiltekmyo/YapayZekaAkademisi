<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatBot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <div class="drag-region"></div>
      <button id="new-chat-btn" class="new-chat-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Yeni Sohbet
      </button>
    </div>
    <div class="sidebar-search">
      <input type="text" id="search-input" placeholder="Sohbetlerde ara..." />
    </div>
    <div id="conversation-list" class="conversation-list"></div>
    <div class="sidebar-footer">
      <div class="model-selector-wrapper">
        <label class="model-label">Model</label>
        <select id="model-select" class="model-select"></select>
      </div>
    </div>
  </aside>

  <!-- Main Chat Area -->
  <main id="main" class="main">
    <div class="main-header drag-region">
      <button id="toggle-sidebar-btn" class="toggle-sidebar-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <span id="header-title" class="header-title">Yeni Sohbet</span>
      <span id="header-model" class="header-model-badge"></span>
    </div>

    <!-- Welcome Screen -->
    <div id="welcome-screen" class="welcome-screen">
      <div class="welcome-content">
        <div class="welcome-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
        </div>
        <h1>Merhaba! Size nasıl yardımcı olabilirim?</h1>
        <p class="welcome-subtitle">Sormak istediğiniz herhangi bir şeyi yazabilirsiniz.</p>
        <div class="suggestion-chips">
          <button class="chip" data-prompt="Bana bir Python projesi fikri öner">🐍 Python projesi fikri</button>
          <button class="chip" data-prompt="JavaScript ile basit bir web uygulaması nasıl yapılır?">🌐 Web uygulaması nasıl yapılır</button>
          <button class="chip" data-prompt="Yapay zeka hakkında kısa bir özet ver">🤖 Yapay zeka nedir</button>
          <button class="chip" data-prompt="Günlük verimliliğimi artırmak için ipuçları ver">⚡ Verimlilik ipuçları</button>
        </div>
      </div>
    </div>

    <!-- Messages Container -->
    <div id="messages-container" class="messages-container" style="display:none;">
      <div id="messages" class="messages"></div>
    </div>

    <!-- Input Area -->
    <div class="input-area">
      <div class="input-wrapper">
        <textarea
          id="message-input"
          placeholder="Mesajınızı yazın..."
          rows="1"
          autofocus
        ></textarea>
        <button id="send-btn" class="send-btn" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
      <div class="input-footer">
        <span id="footer-model-label">Yükleniyor...</span>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
