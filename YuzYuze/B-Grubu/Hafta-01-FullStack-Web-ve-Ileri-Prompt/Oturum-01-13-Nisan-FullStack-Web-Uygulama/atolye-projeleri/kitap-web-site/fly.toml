# fly.toml app configuration file generated for kitap-dunyasi on 2026-04-14T16:14:13+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'kitap-dunyasi'
primary_region = 'ams'

[build]

[env]
  DATABASE_PATH = '/data/bookstore.db'

[[mounts]]
  source = 'kitap_data'
  destination = '/data'

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
