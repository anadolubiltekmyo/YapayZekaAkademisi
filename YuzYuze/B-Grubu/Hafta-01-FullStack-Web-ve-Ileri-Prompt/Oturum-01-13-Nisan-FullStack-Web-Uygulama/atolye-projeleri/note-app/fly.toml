app = 'guvenc-notdefteri'
primary_region = 'ams'

[build]

[env]
  NODE_ENV = 'production'
  DATA_DIR = '/data'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'

[mounts]
  source = 'noteapp_data'
  destination = '/data'
