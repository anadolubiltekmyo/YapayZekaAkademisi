<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Fizikli Yapı — Köprü İnşa Oyunu</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a2028;
    --panel-2: #232c38;
    --accent: #ffb454;
    --accent-2: #59c2ff;
    --ok: #7fd962;
    --bad: #ff6b6b;
    --text: #cbd5e1;
    --text-dim: #7b8795;
    --border: #2d3744;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  #app {
    display: grid;
    grid-template-columns: 280px 1fr;
    height: 100vh;
  }
  #sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 20px;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 18px;
  }
  h1 {
    margin: 0; font-size: 18px; font-weight: 700;
    color: var(--accent); letter-spacing: 0.5px;
  }
  h1 span { color: var(--text-dim); font-weight: 400; font-size: 12px; display:block; margin-top:4px;}
  .level-card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }
  .level-card .level-num {
    font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px;
  }
  .level-card .level-title {
    font-size: 20px; font-weight: 700; color: var(--accent); margin-top: 4px;
  }
  .stat-row {
    display: flex; justify-content: space-between; margin-top: 10px;
    font-size: 13px;
  }
  .stat-row span:last-child { color: var(--accent-2); font-weight: 600; }

  .instructions {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 12px;
    line-height: 1.6;
    color: var(--text-dim);
  }
  .instructions b { color: var(--text); }
  .instructions kbd {
    background: #0d1117; padding: 1px 6px; border-radius: 4px;
    border: 1px solid var(--border); font-family: inherit;
    font-size: 11px; color: var(--accent);
  }

  .btn-group { display: flex; flex-direction: column; gap: 8px; }
  button {
    font: inherit; cursor: pointer;
    padding: 10px 14px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    border-radius: 8px;
    font-size: 13px; font-weight: 600;
    transition: all 0.15s ease;
  }
  button:hover:not(:disabled) { background: #2d3744; border-color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary {
    background: var(--accent);
    color: #1a1000;
    border-color: var(--accent);
  }
  button.primary:hover:not(:disabled) { background: #ffc271; }
  button.success {
    background: var(--ok); color: #0d2b00; border-color: var(--ok);
  }
  button.danger { color: var(--bad); }

  .levels-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }
  .level-dot {
    aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border);
    background: var(--panel-2);
    border-radius: 6px;
    font-size: 12px; font-weight: 600;
    cursor: pointer; color: var(--text-dim);
    transition: all 0.15s;
  }
  .level-dot:hover { border-color: var(--accent-2); color: var(--text); }
  .level-dot.current { background: var(--accent); color: #1a1000; border-color: var(--accent); }
  .level-dot.done {
    background: rgba(127, 217, 98, 0.15);
    color: var(--ok); border-color: var(--ok);
  }
  .level-dot.done.current { background: var(--ok); color: #0d2b00; }

  #status {
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    min-height: 42px;
    display: flex; align-items: center;
  }
  #status.running { border-color: var(--accent-2); color: var(--accent-2); }
  #status.win { border-color: var(--ok); color: var(--ok); background: rgba(127,217,98,0.08); }
  #status.lose { border-color: var(--bad); color: var(--bad); background: rgba(255,107,107,0.08); }

  #stage {
    position: relative;
    background: linear-gradient(to bottom, #0a1624 0%, #14203a 70%, #1a2030 100%);
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
  #stage.testing canvas { cursor: default; }

  #overlay {
    position: absolute; inset: 0;
    pointer-events: none;
    display: flex; align-items: center; justify-content: center;
  }
  .toast {
    pointer-events: auto;
    padding: 24px 36px;
    background: rgba(26, 32, 40, 0.95);
    border: 2px solid var(--accent);
    border-radius: 14px;
    font-size: 22px; font-weight: 700;
    text-align: center;
    animation: pop 0.4s cubic-bezier(.34,1.56,.64,1);
  }
  .toast.win { border-color: var(--ok); color: var(--ok); }
  .toast.lose { border-color: var(--bad); color: var(--bad); }
  .toast small {
    display: block; font-size: 13px; font-weight: 400;
    color: var(--text-dim); margin-top: 8px;
  }
  .toast button { margin-top: 14px; }
  @keyframes pop {
    from { transform: scale(0.5); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }

  #legend {
    position: absolute; top: 12px; left: 12px;
    background: rgba(26, 32, 40, 0.85);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    color: var(--text-dim);
    border: 1px solid var(--border);
  }
  #legend b { color: var(--accent); }
</style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h1>FİZİKLİ YAPI<span>Köprü İnşa Oyunu</span></h1>

      <div class="level-card">
        <div class="level-num">SEVİYE <span id="levelNum">1</span> / 10</div>
        <div class="level-title" id="levelTitle">Küçük Geçit</div>
        <div class="stat-row"><span>Boşluk</span><span id="statGap">—</span></div>
        <div class="stat-row"><span>Ağırlık</span><span id="statWeight">—</span></div>
        <div class="stat-row"><span>Hedef</span><span id="statGoal">3 sn dayan</span></div>
      </div>

      <div id="status">Yapını çiz, sonra Test Et.</div>

      <div class="btn-group">
        <button id="btnTest" class="primary">▶ Yapıyı Test Et</button>
        <button id="btnReset">↻ Çizimi Sıfırla</button>
        <button id="btnStop" disabled>⏹ Testi Durdur</button>
      </div>

      <div class="levels-grid" id="levelsGrid"></div>

      <div class="btn-group">
        <button id="btnPrev">← Önceki</button>
        <button id="btnNext">Sonraki →</button>
      </div>

      <div class="instructions">
        <b>Nasıl oynanır:</b><br>
        • Boş alana <b>sol tık</b>: nokta ekle<br>
        • Noktaya <b>tık + sürükle</b>: çubuk çiz<br>
        • Noktaya <b>sağ tık</b>: sil<br>
        • <kbd>Space</kbd> ile testi başlat<br>
        • Gri noktalar sabit mesnettir.
      </div>
    </aside>

    <main id="stage">
      <canvas id="canvas"></canvas>
      <div id="legend">Mod: <b id="modeText">Çizim</b></div>
      <div id="overlay"></div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
  <script src="game.js"></script>
</body>
</html>
